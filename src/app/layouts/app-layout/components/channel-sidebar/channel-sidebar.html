<header class="channel-sidebar__header shrink-0 border-b border-hairline">
  @if (serverId(); as id) {
    <div class="flex h-12 w-full items-center px-4 text-left font-bold text-ink shadow-2xs select-none">
      <h2 class="m-0 flex-1 truncate text-body-md-medium font-bold text-ink">{{ title() }}</h2>
    </div>
  } @else {
    <div class="p-2.5">
      <app-search-field
        data-search-scope="contacts"
        placeholder="Tìm người hoặc cuộc trò chuyện"
        [(value)]="conversationQuery"
      />
    </div>
  }
</header>


<nav class="nexus-scrollbar min-h-0 flex-1 overflow-y-auto px-2 py-2" [attr.aria-label]="title()">
  @if (serverId(); as id) {
    <app-channel-list [serverId]="id" />
  } @else {
    <app-conversation-list [query]="conversationQuery()" />
  }
</nav>

<app-user-panel />
