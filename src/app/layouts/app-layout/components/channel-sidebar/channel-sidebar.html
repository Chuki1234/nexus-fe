<header class="channel-sidebar__header shrink-0 border-b border-hairline h-12 flex items-center">
  @if (serverId(); as id) {
    <!-- Full-width unified server header — Nút mở dropdown menu server chuẩn phong cách Discord -->
    <div
      #serverMenuTrigger="matMenuTrigger"
      [matMenuTriggerFor]="serverMenu"
      class="channel-sidebar__server-header flex h-12 w-full items-center justify-between px-4 text-left font-bold text-ink hover:bg-surface-feature transition-colors group cursor-pointer shadow-2xs select-none"
    >
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <h2 class="min-w-0 flex-1 text-body-md font-bold text-ink m-0">
          <app-overflow-marquee [text]="title()" />
        </h2>
        <mat-icon
          class="server-header-chevron text-steel group-hover:text-ink"
          [class.server-header-chevron--open]="serverMenuTrigger.menuOpen || isMenuOpen()"
        >
          expand_more
        </mat-icon>
      </div>

      <!-- Nút tạo lời mời nhanh ở góc phải (chỉ hiện khi có quyền canInviteMembers) -->
      @if (canInviteMembers()) {
        <button
          type="button"
          (click)="onInviteServer($event)"
          matTooltip="Tạo lời mời"
          aria-label="Tạo lời mời vào máy chủ"
          class="server-header-invite-btn size-7 rounded-md text-steel hover:text-ink hover:bg-surface/80 flex items-center justify-center transition-colors cursor-pointer shrink-0 ml-2"
        >
          <mat-icon class="!size-4.5 !text-lg leading-none">person_add</mat-icon>
        </button>
      }
    </div>

    <!-- Server Context Menu: compact and aligned on a shared three-column grid. -->
    <mat-menu
      #serverMenu="matMenu"
      (menuOpened)="onMenuOpened()"
      (menuClosed)="onMenuClosed()"
      class="nexus-server-menu"
    >
      <!-- Nhóm 1: Quản trị & Hành động -->
      @if (canInviteMembers()) {
        <button
          mat-menu-item
          type="button"
          (click)="onInviteServer($event)"
          class="server-menu-item server-menu-item--invite"
        >
          <mat-icon class="server-menu-icon text-primary">person_add</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label font-semibold text-primary" text="Mời vào máy chủ" />
          </div>
        </button>
      }

      @if (canManageServer()) {
        <button
          mat-menu-item
          type="button"
          (click)="openServerSettings('server-overview')"
          class="server-menu-item"
        >
          <mat-icon class="server-menu-icon text-steel">settings</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label text-ink" text="Cài đặt máy chủ" />
          </div>
        </button>
      }

      @if (canManageChannels()) {
        <button
          mat-menu-item
          type="button"
          (click)="openCreateChannelDialog()"
          class="server-menu-item"
        >
          <mat-icon class="server-menu-icon text-steel">add_circle</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label text-ink" text="Tạo kênh" />
          </div>
        </button>

        <button
          mat-menu-item
          type="button"
          (click)="onServerOption('create-category')"
          class="server-menu-item"
        >
          <mat-icon class="server-menu-icon text-steel">create_new_folder</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label text-ink" text="Tạo danh mục" />
          </div>
        </button>
      }

      <div class="server-menu-divider" role="separator"></div>

      <!-- Nhóm 3: Thông báo & Bảo mật -->
      <button
        mat-menu-item
        type="button"
        (click)="onServerOption('notifications')"
        class="server-menu-item"
      >
        <mat-icon class="server-menu-icon text-steel">notifications</mat-icon>
        <div class="server-menu-label-box">
          <app-overflow-marquee class="server-menu-label text-ink" text="Cài đặt thông báo" />
        </div>
      </button>

      <button
        mat-menu-item
        type="button"
        (click)="onServerOption('privacy')"
        class="server-menu-item"
      >
        <mat-icon class="server-menu-icon text-steel">security</mat-icon>
        <div class="server-menu-label-box">
          <app-overflow-marquee class="server-menu-label text-ink" text="Cài đặt bảo mật" />
        </div>
      </button>

      <div class="server-menu-divider" role="separator"></div>

      <!-- Nhóm 4: Hồ sơ & Hiển thị -->
      <button
        mat-menu-item
        type="button"
        (click)="onServerOption('edit-profile')"
        class="server-menu-item"
      >
        <mat-icon class="server-menu-icon text-steel">edit</mat-icon>
        <div class="server-menu-label-box">
          <app-overflow-marquee class="server-menu-label text-ink" text="Chỉnh sửa hồ sơ theo máy chủ" />
        </div>
      </button>

      <button
        mat-menu-item
        type="button"
        (click)="toggleHideMutedChannels($event)"
        class="server-menu-item server-menu-item--checkbox"
      >
        <mat-icon class="server-menu-icon text-steel">visibility_off</mat-icon>
        <div class="server-menu-label-box">
          <app-overflow-marquee class="server-menu-label text-ink" text="Ẩn các kênh đã tắt thông báo" />
        </div>
        <div
          class="menu-checkbox"
          aria-hidden="true"
          [class.menu-checkbox--checked]="hideMutedChannels()"
        >
          @if (hideMutedChannels()) {
            <svg
              class="menu-checkbox-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          }
        </div>
      </button>

      <!-- Nhóm 5: Rời hoặc Xóa máy chủ -->
      <div class="server-menu-divider" role="separator"></div>
      @if (isOwner()) {
        <button
          mat-menu-item
          type="button"
          (click)="openDeleteServerDialog()"
          class="server-menu-item server-menu-item--danger"
        >
          <mat-icon class="server-menu-icon !text-danger">delete_forever</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label font-semibold text-danger" text="Xóa máy chủ" />
          </div>
        </button>
      } @else {
        <button
          mat-menu-item
          type="button"
          (click)="openLeaveServerDialog()"
          class="server-menu-item server-menu-item--danger"
        >
          <mat-icon class="server-menu-icon !text-danger">logout</mat-icon>
          <div class="server-menu-label-box">
            <app-overflow-marquee class="server-menu-label font-semibold text-danger" text="Rời khỏi máy chủ" />
          </div>
        </button>
      }
    </mat-menu>
  } @else {
    <div class="flex h-12 w-full items-center px-2.5">
      <button
        type="button"
        (click)="openCommandCenter()"
        data-action="sidebar-search"
        aria-label="Tìm người hoặc cuộc trò chuyện"
        aria-keyshortcuts="Control+K Meta+K"
        class="flex w-full items-center justify-between rounded-sm border border-hairline-strong bg-canvas px-3 py-1.5 text-left text-body-sm text-steel hover:border-primary/60 hover:text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer group select-none"
      >
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <mat-icon aria-hidden="true" class="!w-4 !h-4 !text-[16px] text-steel group-hover:text-primary shrink-0 leading-none transition-colors">search</mat-icon>
          <span class="truncate text-steel group-hover:text-ink font-medium">Tìm người hoặc cuộc trò chuyện</span>
        </div>
        <kbd class="hidden sm:inline-flex items-center rounded bg-surface px-1.5 py-0.5 text-[10px] font-semibold text-steel border border-hairline group-hover:text-ink">Ctrl K</kbd>
      </button>
    </div>
  }
</header>

<nav class="nexus-scrollbar min-h-0 flex-1 overflow-y-auto px-2 py-2" [attr.aria-label]="title()">
  @if (serverId(); as id) {
    <app-channel-list [serverId]="id" />
  } @else {
    <app-conversation-list [query]="conversationQuery()" />
  }
</nav>

<app-user-panel />
