<div
  class="invite-dialog flex w-full max-w-md flex-col overflow-hidden rounded-2xl border border-hairline bg-surface text-ink shadow-modal"
  role="dialog"
  aria-labelledby="invite-title"
>
  <!-- Header -->
  <header class="relative px-5 pt-5 pb-3">
    <div class="pr-8">
      <h2 id="invite-title" class="text-heading-5 font-bold text-ink">
        Mời bạn bè vào {{ data.serverName }}
      </h2>
      <p class="mt-0.5 text-caption text-steel">
        Người nhận sẽ đến <span class="font-semibold text-slate">#{{ data.channelName }}</span>
      </p>
    </div>

    <!-- Close Button -->
    <button
      type="button"
      (click)="close()"
      aria-label="Đóng"
      class="absolute top-4 right-4 flex size-8 items-center justify-center rounded-lg text-steel hover:bg-surface-feature hover:text-ink transition-colors cursor-pointer"
    >
      <mat-icon class="!size-5 !text-xl">close</mat-icon>
    </button>
  </header>

  <!-- Search Input -->
  <div class="px-5 pt-1 pb-3">
    <div class="relative flex items-center rounded-xl bg-canvas border border-hairline px-3 py-2 focus-within:border-primary">
      <mat-icon class="!size-5 !text-xl text-steel mr-2">search</mat-icon>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Tìm kiếm bạn bè"
        class="w-full bg-transparent text-body-sm text-ink placeholder:text-stone outline-none"
      />
      @if (searchQuery()) {
        <button
          type="button"
          (click)="searchQuery.set('')"
          class="text-stone hover:text-ink text-caption"
        >
          <mat-icon class="!size-4 !text-base">cancel</mat-icon>
        </button>
      }
    </div>
  </div>

  <!-- Scrollable Friends List -->
  <div class="invite-friends-list nexus-scrollbar max-h-60 overflow-y-auto px-5 py-1 flex flex-col gap-1">
    @for (friend of filteredFriends(); track friend.id) {
      <div
        class="friend-invite-row flex items-center justify-between rounded-xl p-2 hover:bg-surface-feature/60 transition-colors"
      >
        <div class="flex items-center gap-3 min-w-0">
          <app-avatar [name]="friend.name" size="sm" presence="online" ring="surface" />
          <div class="min-w-0">
            <strong class="block truncate text-body-sm-medium text-ink">{{ friend.name }}</strong>
            <span class="block truncate text-micro text-steel">{{ friend.username }}</span>
          </div>
        </div>

        <button
          type="button"
          (click)="inviteFriend(friend.id)"
          [disabled]="friend.invited"
          class="invite-btn shrink-0 rounded-lg px-4 py-1.5 text-caption font-semibold transition-all cursor-pointer"
          [class.invite-btn--invited]="friend.invited"
        >
          {{ friend.invited ? 'Đã gửi' : 'Mời' }}
        </button>
      </div>
    } @empty {
      <p class="py-6 text-center text-body-sm text-steel">Không tìm thấy bạn bè nào phù hợp.</p>
    }
  </div>

  <!-- Bottom Link Section -->
  <footer class="mt-3 border-t border-hairline/60 bg-surface-feature/30 px-5 pt-4 pb-5">
    <label class="block text-micro-uppercase font-bold text-steel">
      Hoặc, gửi link mời cho họ
    </label>

    <div class="mt-2 flex items-center gap-2 rounded-xl bg-canvas border border-hairline p-1 pl-3">
      <input
        type="text"
        readonly
        [value]="inviteLink()"
        class="min-w-0 flex-1 bg-transparent text-body-sm text-ink outline-none select-all font-mono"
      />
      <button
        mat-flat-button
        type="button"
        (click)="copyLink()"
        class="!rounded-lg !px-4 font-semibold shrink-0"
        [class.!bg-primary]="!copied()"
        [class.!text-on-primary]="!copied()"
        [class.!bg-emerald-600]="copied()"
        [class.!text-white]="copied()"
      >
        <span class="flex items-center gap-1">
          @if (copied()) {
            <mat-icon class="!size-4 !text-base">check</mat-icon>
            <span>Đã sao chép</span>
          } @else {
            <span>Sao chép</span>
          }
        </span>
      </button>
    </div>

    <p class="mt-2 text-micro text-stone">
      Link mời của bạn sẽ hết hạn sau 30 ngày.
      <button type="button" class="text-primary hover:underline font-medium">Chỉnh sửa link mời.</button>
    </p>
  </footer>
</div>
