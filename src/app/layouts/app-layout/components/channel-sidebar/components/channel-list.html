@for (group of groups(); track group.type) {
  <app-section-label class="mt-4 mb-2 block px-1" [text]="group.label" />

  <mat-nav-list class="!px-1 !py-0 flex flex-col gap-1.5">
    @for (channel of group.channels; track channel.id) {
      <a
        mat-list-item
        [routerLink]="['/channels', serverId(), channel.id]"
        routerLinkActive
        #link="routerLinkActive"
        [activated]="link.isActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
        class="channel-row nexus-nav-item !h-auto !min-h-9 !rounded-lg"
      >
        <mat-icon matListItemIcon aria-hidden="true" class="!mr-2.5 !size-5 !text-xl">{{ group.icon }}</mat-icon>
        <span matListItemTitle class="truncate text-body-sm font-medium" [class.text-ink]="!link.isActive && channel.unread">
          {{ channel.name }}
        </span>
        <app-unread-badge
          matListItemMeta
          [count]="channel.mentionCount"
          label="lượt nhắc tên chưa đọc"
        />
      </a>
    }
  </mat-nav-list>
} @empty {
  <p class="px-2 py-4 text-body-sm text-steel">Server này chưa có kênh nào.</p>
}
