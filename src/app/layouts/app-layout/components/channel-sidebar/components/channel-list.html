@for (group of groups(); track group.type) {
  <app-section-label class="mt-3 mb-1 block" [text]="group.label" />

  <mat-nav-list class="!py-0">
    @for (channel of group.channels; track channel.id) {
      <a
        mat-list-item
        [routerLink]="['/channels', serverId(), channel.id]"
        routerLinkActive
        #link="routerLinkActive"
        [activated]="link.isActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <mat-icon matListItemIcon aria-hidden="true">{{ group.icon }}</mat-icon>
        <span matListItemTitle [class.text-ink]="link.isActive || channel.unread">
          {{ channel.name }}
        </span>
        <app-unread-badge
          matListItemMeta
          [count]="channel.mentionCount"
          label="lượt nhắc tên chưa đọc"
        />
      </a>
    }
  </mat-nav-list>
} @empty {
  <p class="px-2 py-4 text-body-sm text-steel">Server này chưa có kênh nào.</p>
}
