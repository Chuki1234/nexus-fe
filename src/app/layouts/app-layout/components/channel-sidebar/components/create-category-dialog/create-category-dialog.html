<div class="nexus-create-category-dialog flex flex-col overflow-hidden bg-surface text-ink">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-hairline px-6 py-4">
    <div>
      <h2 class="text-heading-4 font-bold text-ink m-0">Tạo danh mục</h2>
      @if (data.serverName) {
        <p class="text-caption text-steel mt-0.5 m-0">trong {{ data.serverName }}</p>
      }
    </div>
    <button
      type="button"
      mat-icon-button
      mat-dialog-close
      aria-label="Đóng hộp thoại tạo danh mục"
      class="text-steel hover:text-ink transition-colors"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5 px-6 py-5">
    <!-- Category Name Input -->
    <div class="flex flex-col gap-2">
      <label for="create-category-name-input" class="text-micro-uppercase font-bold tracking-wider text-steel">
        TÊN DANH MỤC
      </label>
      <div class="category-name-input-wrapper flex items-center gap-2.5 rounded-xl border border-hairline bg-canvas px-3.5 py-2.5 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all">
        <mat-icon class="!size-5 !text-xl text-steel shrink-0">folder</mat-icon>
        <input
          id="create-category-name-input"
          type="text"
          [ngModel]="categoryName()"
          (ngModelChange)="categoryName.set($event)"
          name="categoryName"
          placeholder="Danh mục mới"
          maxlength="100"
          autocomplete="off"
          class="w-full bg-transparent text-body-sm font-medium text-ink outline-none placeholder:text-muted"
        />
      </div>
    </div>

    <!-- Private Category Setting Card -->
    <div class="category-private-card flex items-start justify-between gap-4 p-4 rounded-xl border border-hairline bg-surface-soft/60 transition-colors">
      <div class="flex items-start gap-3 min-w-0">
        <div class="category-private-icon size-8 rounded-lg flex items-center justify-center shrink-0 bg-canvas border border-hairline text-steel">
          <mat-icon class="!size-4 !text-base">lock</mat-icon>
        </div>
        <div class="flex flex-col gap-1 min-w-0">
          <span class="text-body-sm font-bold text-ink leading-tight">Danh mục riêng tư</span>
          <p class="text-caption text-steel m-0 leading-relaxed">
            Chỉ những thành viên và vai trò được chọn mới có thể xem danh mục này. Các kênh bên trong sẽ tự động kế thừa quyền riêng tư.
          </p>
        </div>
      </div>

      <!-- Modern Nexus Switch -->
      <label class="nexus-switch relative inline-flex items-center cursor-pointer shrink-0 mt-0.5" aria-label="Bật chế độ danh mục riêng tư">
        <input
          type="checkbox"
          [checked]="isPrivate()"
          (change)="isPrivate.set(!isPrivate())"
          class="sr-only peer"
        />
        <div class="switch-track w-11 h-6 bg-canvas border border-hairline peer-focus:outline-none rounded-full peer peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_12px_rgba(0,237,100,0.3)] transition-all after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:bg-steel peer-checked:after:bg-on-primary after:rounded-full after:h-4.5 after:w-4.5 after:transition-all peer-checked:after:translate-x-5"></div>
      </label>
    </div>

    <!-- Footer Actions -->
    <div class="flex items-center justify-end gap-3 pt-2">
      <button
        type="button"
        mat-button
        mat-dialog-close
        class="!text-steel hover:!text-ink !font-medium"
      >
        Hủy
      </button>
      <button
        type="submit"
        [disabled]="!isNameValid()"
        class="nexus-create-category-btn flex items-center justify-center gap-2 px-5 py-2 rounded-full font-bold text-body-sm transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        [class.bg-primary]="isNameValid()"
        [class.text-on-primary]="isNameValid()"
        [class.hover:bg-primary-soft]="isNameValid()"
      >
        <span>Tạo danh mục</span>
      </button>
    </div>
  </form>
</div>
