<button
  type="button"
  [matMenuTriggerFor]="userMenu"
  class="nexus-interactive-row flex h-9 min-w-0 items-center gap-2 overflow-hidden rounded-lg px-2 py-1 text-left"
>
  <app-avatar [name]="displayName()" size="sm" presence="online" ring="canvas" />
  <span class="min-w-0 flex-1">
    <span class="block truncate text-body-sm-medium text-ink">{{ displayName() }}</span>
    <span class="block truncate text-caption text-steel">Trực tuyến</span>
  </span>
</button>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item type="button" (click)="onSignOut()" [disabled]="signingOut()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    <span>{{ signingOut() ? 'Đang đăng xuất…' : 'Đăng xuất' }}</span>
  </button>
</mat-menu>

<button
  mat-icon-button
  type="button"
  class="nexus-icon-control nexus-audio-toggle !size-9"
  [attr.aria-pressed]="micMuted()"
  [matTooltip]="micMuted() ? 'Bật micrô' : 'Tắt micrô'"
  (click)="micMuted.set(!micMuted())"
>
  <mat-icon>{{ micMuted() ? 'mic_off' : 'mic' }}</mat-icon>
  <span class="sr-only">{{ micMuted() ? 'Bật micrô' : 'Tắt micrô' }}</span>
</button>

<button
  mat-icon-button
  type="button"
  class="nexus-icon-control nexus-audio-toggle !size-9"
  [attr.aria-pressed]="deafened()"
  [matTooltip]="deafened() ? 'Bật loa' : 'Tắt loa'"
  (click)="deafened.set(!deafened())"
>
  <mat-icon>{{ deafened() ? 'headset_off' : 'headset' }}</mat-icon>
  <span class="sr-only">{{ deafened() ? 'Bật loa' : 'Tắt loa' }}</span>
</button>

<button
  mat-icon-button
  type="button"
  disabled
  class="nexus-icon-control !size-9"
  aria-label="Cài đặt — do team Settings phụ trách"
  matTooltip="Phần Cài đặt do team Settings phụ trách"
>
  <mat-icon aria-hidden="true">settings</mat-icon>
</button>
