<button
  type="button"
  [matMenuTriggerFor]="userMenu"
  class="flex min-w-0 flex-1 items-center gap-2 rounded-xl p-1.5 text-left hover:bg-surface-feature transition-all cursor-pointer group"
>
  <app-avatar [name]="displayName()" size="sm" presence="online" ring="canvas" />
  <span class="min-w-0 flex-1">
    <span class="block truncate text-body-sm font-bold text-ink group-hover:text-primary transition-colors leading-snug">{{ displayName() }}</span>
    <span class="block truncate text-[11px] font-medium text-steel leading-tight">Trực tuyến</span>
  </span>
</button>

<mat-menu #userMenu="matMenu" class="!rounded-2xl !border !border-hairline !bg-surface shadow-modal">
  <button mat-menu-item type="button" (click)="openSettings()">
    <mat-icon aria-hidden="true" class="!text-steel">settings</mat-icon>
    <span>Cài đặt người dùng</span>
  </button>
  <button mat-menu-item type="button" (click)="onSignOut()" [disabled]="signingOut()">
    <mat-icon aria-hidden="true" class="!text-danger">logout</mat-icon>
    <span class="text-danger font-semibold">{{ signingOut() ? 'Đang đăng xuất…' : 'Đăng xuất' }}</span>
  </button>
</mat-menu>

<div class="flex items-center gap-0.5 shrink-0">
  <button
    type="button"
    [attr.aria-pressed]="micMuted()"
    [matTooltip]="micMuted() ? 'Bật micrô' : 'Tắt micrô'"
    (click)="micMuted.set(!micMuted())"
    class="w-8 h-8 rounded-lg text-steel hover:text-ink hover:bg-surface-feature flex items-center justify-center transition-all cursor-pointer"
  >
    <mat-icon class="!w-5 !h-5 !text-[20px] leading-none" [class.text-danger]="micMuted()">{{ micMuted() ? 'mic_off' : 'mic' }}</mat-icon>
    <span class="sr-only">{{ micMuted() ? 'Bật micrô' : 'Tắt micrô' }}</span>
  </button>

  <button
    type="button"
    [attr.aria-pressed]="deafened()"
    [matTooltip]="deafened() ? 'Bật loa' : 'Tắt loa'"
    (click)="deafened.set(!deafened())"
    class="w-8 h-8 rounded-lg text-steel hover:text-ink hover:bg-surface-feature flex items-center justify-center transition-all cursor-pointer"
  >
    <mat-icon class="!w-5 !h-5 !text-[20px] leading-none" [class.text-danger]="deafened()">{{ deafened() ? 'headset_off' : 'headset' }}</mat-icon>
    <span class="sr-only">{{ deafened() ? 'Bật loa' : 'Tắt loa' }}</span>
  </button>

  <button
    type="button"
    matTooltip="Cài đặt người dùng"
    (click)="openSettings()"
    class="w-8 h-8 rounded-lg text-steel hover:text-ink hover:bg-surface-feature flex items-center justify-center transition-all cursor-pointer"
  >
    <mat-icon class="!w-5 !h-5 !text-[20px] leading-none">settings</mat-icon>
    <span class="sr-only">Cài đặt người dùng</span>
  </button>
</div>
