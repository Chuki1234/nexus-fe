@if (isVoiceConnected()) {
  <!-- Voice Connected Banner (Discord Style) -->
  <div class="user-panel__voice-status w-full flex items-center justify-between border-b border-hairline/60 pb-2 mb-2">
    <div class="flex items-center gap-2 min-w-0 flex-1">
      <mat-icon class="!size-5 !text-xl text-primary animate-pulse shrink-0">signal_cellular_alt</mat-icon>
      <div class="min-w-0 flex-1">
        <span class="block truncate text-body-sm-medium text-primary font-bold">Đã Kết Nối Giọng Nói</span>
        <span class="block truncate text-micro text-steel">#{{ voiceChannelName() }}</span>
      </div>
    </div>

    <!-- Voice Control Actions (Cleanly centered and aligned with proper spacing) -->
    <div class="user-panel__voice-actions-group shrink-0">
      <!-- Test Mic Button (Waveform icon) -->
      <button
        mat-icon-button
        type="button"
        class="user-panel__voice-btn nexus-icon-control"
        [class.!text-primary]="isTestingMic()"
        [class.!bg-primary/20]="isTestingMic()"
        [matTooltip]="isTestingMic() ? 'Dừng kiểm tra Micro' : 'Kiểm tra Micro (Test Mic)'"
        (click)="toggleTestMic()"
      >
        <mat-icon>{{ isTestingMic() ? 'equalizer' : 'graphic_eq' }}</mat-icon>
      </button>

      <!-- Disconnect Button (Optically centered) -->
      <button
        mat-icon-button
        type="button"
        class="user-panel__voice-btn user-panel__voice-btn--disconnect !text-danger hover:!bg-danger/20"
        matTooltip="Ngắt kết nối"
        (click)="disconnectVoice()"
      >
        <mat-icon>call_end</mat-icon>
      </button>
    </div>
  </div>

  <!-- Realtime Mic Test Level Bar (shown when user is testing mic) -->
  @if (isTestingMic()) {
    <div class="flex items-center gap-2 px-1 pb-2 mb-2 border-b border-hairline/40">
      <span class="text-[11px] text-steel shrink-0 font-medium">Mic Level:</span>
      <div class="h-1.5 flex-1 rounded-full bg-surface-feature overflow-hidden">
        <div
          class="h-full bg-primary transition-all duration-75 rounded-full"
          [style.width.%]="mediaDevices.audioLevel()"
        ></div>
      </div>
      <span class="text-[11px] text-primary font-mono w-7 text-right">{{ mediaDevices.audioLevel() }}%</span>
    </div>
  }
}

<div class="flex items-center justify-between w-full min-w-0">
  <!-- Bấm avatar/tên → sang trang hồ sơ đầy đủ. Rê chuột vào → hiện thẻ hồ sơ nhỏ.
       [src]: avatar ở đáy là ảnh THẬT, khớp với ảnh vừa đổi trong cài đặt. -->
  <a
    [routerLink]="username() ? ['/u', username()] : null"
    cdkOverlayOrigin
    #identityTrigger="cdkOverlayOrigin"
    class="user-panel__identity nexus-interactive-row"
    (mouseenter)="openCard()"
    (mouseleave)="scheduleClose()"
    (focus)="openCard()"
    (blur)="scheduleClose()"
  >
    <app-avatar
      [name]="displayName()"
      [src]="avatarUrl()"
      size="sm"
      presence="online"
      ring="canvas"
    />
    <span class="user-panel__identity-copy">
      <span class="user-panel__name">{{ displayName() }}</span>
      <span class="user-panel__status">Trực tuyến</span>
    </span>
  </a>

  <!-- Thẻ hồ sơ nhỏ, nổi đè lên khi hover. Trước đây chỗ này là menu chỉ có
       Xóa tài khoản / Đăng xuất — bấm vào avatar của chính mình mà chỉ được mời
       rời đi. Hai lệnh đó đã chuyển vào màn Cài đặt. -->
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="identityTrigger"
    [cdkConnectedOverlayOpen]="popoverOpen()"
    [cdkConnectedOverlayPositions]="popoverPositions"
  >
    <div (mouseenter)="openCard()" (mouseleave)="scheduleClose()">
      @if (store.profile(); as person) {
        <app-profile-popover [profile]="person">
          <a
            [routerLink]="['/u', person.username]"
            class="block w-full rounded-full bg-primary px-3 py-2 text-center text-button-md text-on-primary transition-colors hover:bg-primary-soft"
          >
            Xem hồ sơ đầy đủ
          </a>
        </app-profile-popover>
      } @else {
        <!-- Hồ sơ tải sau khi thẻ đã mở. Khung xám giữ đúng khổ thẻ thật để lúc
             dữ liệu về không bị giật khung. -->
        <div
          role="status"
          aria-label="Đang tải hồ sơ"
          class="w-80 overflow-hidden rounded-lg border border-hairline bg-surface shadow-modal"
        >
          <div class="h-20 w-full animate-pulse bg-surface-soft"></div>
          <div class="space-y-3 px-4 pb-4">
            <div class="-mt-8 size-20 animate-pulse rounded-full bg-surface-soft ring-4 ring-surface"></div>
            <div class="h-4 w-32 animate-pulse rounded bg-surface-soft"></div>
            <div class="h-3 w-24 animate-pulse rounded bg-surface-soft"></div>
          </div>
        </div>
      }
    </div>
  </ng-template>

  <div class="user-panel__controls" role="group" aria-label="Điều khiển âm thanh và ứng dụng">
    <button
      mat-icon-button
      type="button"
      class="user-panel__control user-panel__control--mic nexus-icon-control nexus-audio-toggle"
      [class.!text-danger]="isMicMuted()"
      [class.!bg-danger/20]="isMicMuted()"
      [attr.aria-pressed]="isMicMuted()"
      [matTooltip]="!isVoiceConnected() ? 'Chưa tham gia phòng thoại' : (isDeafened() ? 'Bật tai nghe trước' : (isMicMuted() ? 'Bật micrô' : 'Tắt micrô'))"
      [disabled]="!isVoiceConnected() || isDeafened()"
      (click)="toggleMic()"
    >
      <mat-icon>{{ isMicMuted() ? 'mic_off' : 'mic' }}</mat-icon>
      <span class="sr-only">{{ isMicMuted() ? 'Bật micrô' : 'Tắt micrô' }}</span>
    </button>

    <button
      mat-icon-button
      type="button"
      class="user-panel__control user-panel__control--deafen nexus-icon-control nexus-audio-toggle"
      [class.!text-danger]="isDeafened()"
      [class.!bg-danger/20]="isDeafened()"
      [attr.aria-pressed]="isDeafened()"
      [matTooltip]="!isVoiceConnected() ? 'Chưa tham gia phòng thoại' : (isDeafened() ? 'Bật âm thanh' : 'Tắt âm thanh')"
      [disabled]="!isVoiceConnected()"
      (click)="toggleDeafen()"
    >
      <mat-icon>{{ isDeafened() ? 'headset_off' : 'headset' }}</mat-icon>
      <span class="sr-only">{{ isDeafened() ? 'Bật âm thanh' : 'Tắt âm thanh' }}</span>
    </button>

    <button
      mat-icon-button
      type="button"
      class="user-panel__control user-panel__control--settings nexus-icon-control"
      aria-label="Cài đặt"
      matTooltip="Cài đặt"
      (click)="openSettings()"
    >
      <mat-icon aria-hidden="true">settings</mat-icon>
    </button>
  </div>
</div>
