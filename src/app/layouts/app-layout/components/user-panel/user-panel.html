@if (isVoiceConnected()) {
  <!-- Voice Connected Banner (Discord Style) -->
  <div class="user-panel__voice-status flex items-center justify-between border-b border-hairline/60 pb-2 mb-2">
    <div class="flex items-center gap-2 min-w-0">
      <mat-icon class="!size-5 !text-xl text-primary animate-pulse">signal_cellular_alt</mat-icon>
      <div class="min-w-0">
        <span class="block truncate text-body-sm-medium text-primary font-bold">Đã Kết Nối Giọng Nói</span>
        <span class="block truncate text-micro text-steel">#{{ voiceChannelName() }}</span>
      </div>
    </div>
    <button
      mat-icon-button
      type="button"
      class="!size-8 !text-danger hover:!bg-danger/20"
      matTooltip="Ngắt kết nối"
      (click)="disconnectVoice()"
    >
      <mat-icon class="!size-4 !text-base">call_end</mat-icon>
    </button>
  </div>

  <!-- Voice Quick Action Toolbar -->
  <div class="user-panel__voice-actions flex items-center justify-around border-b border-hairline/60 pb-2 mb-2">
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-8"
      [class.!text-primary]="isScreenSharing()"
      [matTooltip]="isScreenSharing() ? 'Dừng chia sẻ' : 'Chia sẻ màn hình'"
      (click)="toggleScreenShare()"
    >
      <mat-icon class="!size-4 !text-base">{{ isScreenSharing() ? 'stop_screen_share' : 'screen_share' }}</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-8"
      [class.!text-primary]="isCameraOn()"
      [matTooltip]="isCameraOn() ? 'Tắt camera' : 'Bật camera'"
      (click)="toggleCamera()"
    >
      <mat-icon class="!size-4 !text-base">{{ isCameraOn() ? 'videocam' : 'videocam_off' }}</mat-icon>
    </button>
  </div>
}

<div class="flex items-center justify-between w-full min-w-0">
<button
  type="button"
  cdkOverlayOrigin
  #identityTrigger="cdkOverlayOrigin"
  class="user-panel__identity nexus-interactive-row"
  aria-haspopup="dialog"
  [attr.aria-expanded]="popoverOpen()"
  (click)="toggleProfileCard()"
>
  <!-- [src]: avatar ở đáy phải là ảnh THẬT, khớp với ảnh vừa đổi trong cài đặt.
       Thiếu nó thì chỗ này hiện chữ cái trong khi mọi màn khác hiện ảnh. -->
  <app-avatar
    [name]="displayName()"
    [src]="avatarUrl()"
    size="sm"
    presence="online"
    ring="canvas"
  />
  <span class="user-panel__identity-copy">
    <span class="user-panel__name">{{ displayName() }}</span>
    <span class="user-panel__status">Trực tuyến</span>
  </span>
</button>

<!-- Thẻ hồ sơ nhỏ, nổi đè lên giao diện. Trước đây chỗ này là menu chỉ có hai
     lệnh xoá/đăng xuất — bấm vào avatar của chính mình mà chỉ được mời rời đi. -->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="identityTrigger"
  [cdkConnectedOverlayOpen]="popoverOpen()"
  [cdkConnectedOverlayPositions]="popoverPositions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="popoverOpen.set(false)"
  (detach)="popoverOpen.set(false)"
>
  <div (keydown)="onOverlayKeydown($event)">
    @if (store.profile(); as person) {
      <!-- Chỉ còn một hành động. Cài đặt đã có nút bánh răng ngay cạnh khối
           này, còn Đăng xuất và Xóa tài khoản nằm trong màn Cài đặt — nhắc lại ở
           đây chỉ làm thẻ hồ sơ trông như một menu thoát. -->
      <app-profile-popover [profile]="person">
        <a
          [routerLink]="['/u', person.username]"
          (click)="popoverOpen.set(false)"
          class="block w-full rounded-full bg-primary px-3 py-2 text-center text-button-md text-on-primary transition-colors hover:bg-primary-soft"
        >
          Xem hồ sơ đầy đủ
        </a>
      </app-profile-popover>
    } @else {
      <!-- Hồ sơ tải sau khi thẻ đã mở (xem toggleProfileCard). Khung xám giữ
           đúng khổ thẻ thật để lúc dữ liệu về không bị giật khung. -->
      <div
        role="status"
        aria-label="Đang tải hồ sơ"
        class="w-80 overflow-hidden rounded-lg border border-hairline bg-surface shadow-modal"
      >
        <div class="h-20 w-full animate-pulse bg-surface-soft"></div>
        <div class="space-y-3 px-4 pb-4">
          <div class="-mt-8 size-20 animate-pulse rounded-full bg-surface-soft ring-4 ring-surface"></div>
          <div class="h-4 w-32 animate-pulse rounded bg-surface-soft"></div>
          <div class="h-3 w-24 animate-pulse rounded bg-surface-soft"></div>
        </div>
      </div>
    }
  </div>
</ng-template>

<div class="user-panel__controls" role="group" aria-label="Điều khiển âm thanh và ứng dụng">
  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--mic nexus-icon-control nexus-audio-toggle"
    [attr.aria-pressed]="micMuted()"
    [matTooltip]="micMuted() ? 'Bật micrô' : 'Tắt micrô'"
    (click)="micMuted.set(!micMuted())"
  >
    <mat-icon>{{ micMuted() ? 'mic_off' : 'mic' }}</mat-icon>
    <span class="sr-only">{{ micMuted() ? 'Bật micrô' : 'Tắt micrô' }}</span>
  </button>

  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--deafen nexus-icon-control nexus-audio-toggle"
    [attr.aria-pressed]="deafened()"
    [matTooltip]="deafened() ? 'Bật loa' : 'Tắt loa'"
    (click)="deafened.set(!deafened())"
  >
    <mat-icon>{{ deafened() ? 'headset_off' : 'headset' }}</mat-icon>
    <span class="sr-only">{{ deafened() ? 'Bật loa' : 'Tắt loa' }}</span>
  </button>

  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--settings nexus-icon-control"
    aria-label="Cài đặt"
    matTooltip="Cài đặt"
    (click)="openSettings()"
  >
    <mat-icon aria-hidden="true">settings</mat-icon>
  </button>
</div>
</div>
