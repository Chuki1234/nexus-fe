@if (isVoiceConnected()) {
  <!-- Voice Connected Banner (Discord Style) -->
  <div class="user-panel__voice-status flex items-center justify-between border-b border-hairline/60 pb-2 mb-2">
    <div class="flex items-center gap-2 min-w-0">
      <mat-icon class="!size-5 !text-xl text-primary animate-pulse">signal_cellular_alt</mat-icon>
      <div class="min-w-0">
        <span class="block truncate text-body-sm-medium text-primary font-bold">Đã Kết Nối Giọng Nói</span>
        <span class="block truncate text-micro text-steel">#{{ voiceChannelName() }}</span>
      </div>
    </div>
    <button
      mat-icon-button
      type="button"
      class="!size-8 !text-danger hover:!bg-danger/20"
      matTooltip="Ngắt kết nối"
      (click)="disconnectVoice()"
    >
      <mat-icon class="!size-4 !text-base">call_end</mat-icon>
    </button>
  </div>

  <!-- Voice Quick Action Toolbar -->
  <div class="user-panel__voice-actions flex items-center justify-around border-b border-hairline/60 pb-2 mb-2">
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-8"
      [class.!text-primary]="isScreenSharing()"
      [matTooltip]="isScreenSharing() ? 'Dừng chia sẻ' : 'Chia sẻ màn hình'"
      (click)="toggleScreenShare()"
    >
      <mat-icon class="!size-4 !text-base">{{ isScreenSharing() ? 'stop_screen_share' : 'screen_share' }}</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-8"
      [class.!text-primary]="isCameraOn()"
      [matTooltip]="isCameraOn() ? 'Tắt camera' : 'Bật camera'"
      (click)="toggleCamera()"
    >
      <mat-icon class="!size-4 !text-base">{{ isCameraOn() ? 'videocam' : 'videocam_off' }}</mat-icon>
    </button>
  </div>
}

<div class="flex items-center justify-between w-full min-w-0">
<button
  type="button"
  [matMenuTriggerFor]="userMenu"
  class="user-panel__identity nexus-interactive-row"
>
  <app-avatar [name]="displayName()" size="sm" presence="online" ring="canvas" />
  <span class="user-panel__identity-copy">
    <span class="user-panel__name">{{ displayName() }}</span>
    <span class="user-panel__status">Trực tuyến</span>
  </span>
</button>

<mat-menu #userMenu="matMenu" class="!rounded-2xl !border !border-hairline !bg-surface shadow-modal">
  <button mat-menu-item type="button" (click)="openDeleteAccount()">
    <mat-icon aria-hidden="true" class="!text-danger">person_remove</mat-icon>
    <span class="text-danger font-semibold">Xóa tài khoản</span>
  </button>
  <button mat-menu-item type="button" (click)="onSignOut()" [disabled]="signingOut()">
    <mat-icon aria-hidden="true" class="!text-danger">logout</mat-icon>
    <span class="text-danger font-semibold">{{ signingOut() ? 'Đang đăng xuất…' : 'Đăng xuất' }}</span>
  </button>
</mat-menu>

<div class="user-panel__controls" role="group" aria-label="Điều khiển âm thanh và ứng dụng">
  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--mic nexus-icon-control nexus-audio-toggle"
    [attr.aria-pressed]="micMuted()"
    [matTooltip]="micMuted() ? 'Bật micrô' : 'Tắt micrô'"
    (click)="micMuted.set(!micMuted())"
  >
    <mat-icon>{{ micMuted() ? 'mic_off' : 'mic' }}</mat-icon>
    <span class="sr-only">{{ micMuted() ? 'Bật micrô' : 'Tắt micrô' }}</span>
  </button>

  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--deafen nexus-icon-control nexus-audio-toggle"
    [attr.aria-pressed]="deafened()"
    [matTooltip]="deafened() ? 'Bật loa' : 'Tắt loa'"
    (click)="deafened.set(!deafened())"
  >
    <mat-icon>{{ deafened() ? 'headset_off' : 'headset' }}</mat-icon>
    <span class="sr-only">{{ deafened() ? 'Bật loa' : 'Tắt loa' }}</span>
  </button>

  <button
    mat-icon-button
    type="button"
    class="user-panel__control user-panel__control--settings nexus-icon-control"
    aria-label="Cài đặt"
    matTooltip="Cài đặt"
    (click)="openSettings()"
  >
    <mat-icon aria-hidden="true">settings</mat-icon>
  </button>
</div>
</div>
