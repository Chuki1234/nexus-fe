<main class="flex min-h-dvh items-center justify-center bg-canvas px-4 py-12">
  <section
    class="nexus-boot !relative !inset-auto !bg-transparent !p-0"
    role="status"
    aria-live="polite"
    [attr.aria-label]="status()"
  >
    <div class="nexus-boot__content">
      <div class="nexus-boot__brand-stage" aria-hidden="true">
        <span class="nexus-boot__beam nexus-boot__beam--wide"></span>
        <span class="nexus-boot__beam nexus-boot__beam--tight"></span>
        <span class="nexus-boot__halo"></span>
        <img
          class="nexus-boot__brand-logo"
          src="/assets/nexus-brand-transparent.png"
          width="1983"
          height="532"
          alt=""
        />
      </div>

      <div class="nexus-boot__copy">
        <span>{{ status() }}</span>
      </div>

      <span class="nexus-boot__progress" aria-hidden="true">
        <span></span>
      </span>
    </div>
  </section>
</main>
