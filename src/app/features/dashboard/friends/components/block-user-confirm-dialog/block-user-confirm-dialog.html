<div class="block-dialog">
  <div class="block-dialog__header">
    <div class="block-dialog__icon-wrap">
      <mat-icon class="block-dialog__icon">block</mat-icon>
    </div>
    <div class="block-dialog__titles">
      <h2 class="block-dialog__title">Chặn {{ data.displayName }}?</h2>
      <p class="block-dialog__subtitle">&#64;{{ data.username }}</p>
    </div>
    <button
      type="button"
      (click)="onCancel()"
      class="block-dialog__close-btn"
      aria-label="Đóng"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="block-dialog__content">
    <p class="block-dialog__body">
      Bạn có chắc chắn muốn chặn <strong class="block-dialog__target-name">{{ data.displayName }}</strong> không? Người dùng này sẽ không thể gửi tin nhắn trực tiếp, bắt đầu cuộc gọi hoặc gửi lời mời kết bạn cho bạn nữa.
    </p>

    <div class="block-dialog__warning-box">
      <mat-icon class="block-dialog__warning-icon">warning_amber</mat-icon>
      <span class="block-dialog__warning-text">
        Quan hệ bạn bè hiện tại (nếu có) sẽ bị hủy bỏ ngay lập tức.
      </span>
    </div>
  </div>

  <div class="block-dialog__actions">
    <button
      type="button"
      class="block-dialog__btn block-dialog__btn--cancel"
      (click)="onCancel()"
    >
      Hủy
    </button>
    <button
      type="button"
      class="block-dialog__btn block-dialog__btn--danger"
      (click)="onConfirm()"
    >
      <mat-icon class="!size-4 !text-base">block</mat-icon>
      Chặn người dùng
    </button>
  </div>
</div>
