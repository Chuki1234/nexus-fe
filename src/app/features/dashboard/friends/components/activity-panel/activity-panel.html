<div class="p-4">
  @if (activePeople().length > 0) {
    <ul class="space-y-3" aria-label="Hoạt động của bạn bè">
      @for (person of activePeople(); track person.id) {
        <li class="activity-card rounded-xl bg-canvas p-3">
          <div class="flex items-start gap-3">
            <app-profile-avatar
              [username]="person.id"
              [name]="person.name"
              [presence]="person.presence"
              size="sm"
              ring="canvas"
            />
            <span class="min-w-0 flex-1">
              <span class="block truncate text-body-sm-medium text-ink">{{ person.name }}</span>
              <span class="mt-0.5 block text-caption text-steel">
                {{ person.statusMessage ?? 'Đang trực tuyến trên NexusCord' }}
              </span>
            </span>
          </div>
        </li>
      }
    </ul>
  } @else {
    <app-empty-state
      class="flex min-h-80"
      icon="nightlight"
      title="Hiện khá yên tĩnh"
      message="Hoạt động của bạn bè sẽ xuất hiện tại đây."
    />
  }
</div>
