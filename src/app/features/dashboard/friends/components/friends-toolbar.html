<mat-toolbar class="friends-toolbar flex h-12 min-h-12 items-center gap-2 !px-3 sm:!px-4">
  <!-- Nhóm tiêu đề "Bạn bè" -->
  <span class="friends-toolbar__title flex items-center gap-2.5 shrink-0">
    <span class="friends-toolbar__badge" aria-hidden="true">
      <mat-icon>group</mat-icon>
    </span>
    <h1 class="text-body-md-medium font-semibold text-ink whitespace-nowrap">Bạn bè</h1>
  </span>

  <span aria-hidden="true" class="hidden sm:block mx-1 h-5 w-px shrink-0 bg-hairline"></span>

  <!-- Bộ lọc Tabs cuộn ngang mượt mà trong dòng, ôm khít các nút chức năng -->
  <div
    class="friends-segmented flex items-center gap-1 rounded-full bg-surface-soft p-1 overflow-x-auto min-w-0 w-fit"
    role="group"
    aria-label="Chọn chế độ bạn bè"
  >
    @for (option of tabs; track option.id) {
      <button
        type="button"
        (click)="tab.set(option.id)"
        [attr.aria-pressed]="tab() === option.id"
        class="nexus-filter-tab min-h-8 shrink-0 rounded-full border px-3 text-body-sm-medium flex items-center gap-1.5 cursor-pointer whitespace-nowrap"
      >
        <span>{{ option.label }}</span>
        @if (option.id === 'pending' && pendingCount() > 0) {
          <span class="inline-flex items-center justify-center px-1.5 py-0.5 min-w-4.5 h-4.5 rounded-full bg-danger text-white text-[11px] font-bold leading-none">
            {{ pendingCount() }}
          </span>
        }
      </button>
    }
  </div>

  <!-- Nút chức năng luôn được ghim cố định ở góc phải -->
  <span class="friends-toolbar__actions flex items-center gap-1 rounded-full bg-surface-soft p-1 shrink-0 ml-auto">
    @if (showActivityToggle()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control"
        [attr.aria-expanded]="activityOpen()"
        [attr.aria-label]="activityOpen() ? 'Ẩn hoạt động bạn bè' : 'Hiện hoạt động bạn bè'"
        [matTooltip]="activityOpen() ? 'Ẩn hoạt động' : 'Hiện hoạt động'"
        (click)="toggleActivity.emit()"
      >
        <mat-icon aria-hidden="true">view_sidebar</mat-icon>
      </button>
    }

    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control"
      (click)="toggleTheme()"
      [attr.aria-pressed]="theme() === 'light'"
      [attr.aria-label]="
        theme() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'
      "
      [matTooltip]="theme() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối'"
    >
      <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span class="sr-only">
        {{ theme() === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối' }}
      </span>
    </button>
  </span>
</mat-toolbar>
