@if (channel(); as current) {
  <app-chat-toolbar
    [title]="current.name"
    [subtitle]="current.topic"
    [leadingIcon]="current.type === 'voice' ? 'volume_up' : 'tag'"
    [detailsOpen]="detailsOpen()"
    detailsLabel="thành viên"
    (toggleDetails)="detailsOpen.set(!detailsOpen())"
  />

  <div class="flex min-h-0 flex-1">
    <div class="flex min-w-0 flex-1 flex-col">
      @if (current.type === 'voice') {
        <!-- Kênh thoại: phần nghe/nói thật thuộc phase C2. -->
        <app-empty-state
          class="min-h-0 flex-1"
          icon="volume_up"
          [title]="current.name"
          message="Chưa có ai trong kênh thoại này."
        />
      } @else {
        <!-- P3 sẽ thay khối này bằng danh sách tin nhắn thật. -->
        <div
          class="chat-history nexus-scrollbar flex min-h-0 flex-1 flex-col justify-end overflow-y-auto px-4 py-6"
          data-chat-wallpaper="doodle"
        >
          <section class="chat-intro max-w-2xl">
            <h2 class="text-heading-3 text-ink">Chào mừng tới #{{ current.name }}</h2>
            <p class="mt-2 max-w-prose text-body-md text-slate">Đây là phần mở đầu của kênh này.</p>
          </section>
        </div>

        <app-message-composer [target]="'#' + current.name" />
      }
    </div>

    <app-context-panel title="Thành viên" [open]="detailsOpen()" (closed)="detailsOpen.set(false)">
      <app-empty-state
        class="flex min-h-full"
        icon="group"
        title="Chưa có dữ liệu thành viên"
        message="Danh sách sẽ xuất hiện tại đây khi máy chủ được kết nối với backend."
      />
    </app-context-panel>
  </div>
} @else {
  <app-empty-state icon="search_off" message="Không tìm thấy kênh này." />
}
