@if (profileUsername()) {
  @if (loading()) {
    <!-- Skeleton khi đang tra hồ sơ: giữ đúng khung để không nhảy layout -->
    <div
      class="mt-2 max-w-sm animate-pulse overflow-hidden rounded-2xl border border-hairline bg-canvas-soft/90"
      aria-hidden="true"
    >
      <div class="h-28 w-full bg-surface-feature"></div>
      <div class="space-y-2 p-4">
        <div class="h-4 w-1/3 rounded bg-surface-feature"></div>
        <div class="h-3 w-1/2 rounded bg-surface-feature"></div>
      </div>
    </div>
  } @else if (profile(); as p) {
    <div class="mt-2 max-w-sm">
      <app-profile-preview-card
        [displayName]="p.displayName || p.username"
        [username]="p.username"
        [avatarUrl]="p.avatarUrl"
        [bannerUrl]="p.bannerUrl"
        [accentColor]="p.accentColor"
        [statusMessage]="p.statusMessage"
        [location]="p.location"
        [bio]="p.bio"
        [links]="p.links"
      />
      <a
        mat-stroked-button
        [routerLink]="['/u', p.username]"
        class="nexus-embed-action mt-2"
      >
        <mat-icon>person</mat-icon>
        Xem hồ sơ
      </a>
    </div>
  }
  <!-- profile() null sau khi tải xong = không có hồ sơ / không có quyền xem →
       không vẽ card, link inline trong tin nhắn vẫn còn. -->
}
