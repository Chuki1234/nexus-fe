<div class="message-actions" role="toolbar" [attr.aria-label]="'Thao tác tin nhắn của ' + author()">
  <button
    mat-icon-button
    type="button"
    class="message-action--reaction"
    [matMenuTriggerFor]="reactionMenu"
    matTooltip="Thêm cảm xúc"
    aria-label="Thêm cảm xúc"
  >
    <mat-icon aria-hidden="true">add_reaction</mat-icon>
  </button>
  <button
    mat-icon-button
    type="button"
    class="message-action--reply"
    matTooltip="Trả lời"
    aria-label="Trả lời"
    (click)="requestReply()"
  >
    <mat-icon aria-hidden="true">reply</mat-icon>
  </button>
  <button
    mat-icon-button
    type="button"
    class="message-action--pin"
    [class.message-action--pinned]="pinned()"
    [matTooltip]="pinned() ? 'Bỏ ghim tin nhắn' : 'Ghim tin nhắn'"
    [attr.aria-label]="pinned() ? 'Bỏ ghim tin nhắn' : 'Ghim tin nhắn'"
    (click)="requestTogglePin()"
  >
    <mat-icon aria-hidden="true">push_pin</mat-icon>
  </button>
  <button
    mat-icon-button
    type="button"
    class="message-action--more"
    [matMenuTriggerFor]="moreMenu"
    matTooltip="Thêm thao tác"
    aria-label="Thêm thao tác"
  >
    <mat-icon aria-hidden="true">more_horiz</mat-icon>
  </button>
</div>

<mat-menu
  #reactionMenu="matMenu"
  class="nexus-message-reaction-menu"
  xPosition="before"
  yPosition="above"
  [overlapTrigger]="false"
>
  @for (reaction of reactions; track reaction.emoji) {
    <button
      mat-menu-item
      type="button"
      class="message-reaction-option"
      [attr.aria-label]="reaction.label"
      (click)="toggleReaction(reaction.emoji)"
    >
      <span aria-hidden="true">{{ reaction.emoji }}</span>
    </button>
  }
</mat-menu>

<mat-menu
  #moreMenu="matMenu"
  class="nexus-message-more-menu"
  xPosition="before"
  [overlapTrigger]="false"
>
  @if (ownMessage() && canEdit()) {
    <button mat-menu-item type="button" (click)="requestEdit()">
      <mat-icon aria-hidden="true">edit_note</mat-icon>
      <span class="message-menu-copy">
        <span>Chỉnh sửa tin nhắn</span>
      </span>
    </button>
  }
  <button mat-menu-item type="button" (click)="requestForward()">
    <mat-icon aria-hidden="true">forward_to_inbox</mat-icon>
    <span class="message-menu-copy">
      <span>Chuyển tiếp</span>
    </span>
  </button>
  <button mat-menu-item type="button" (click)="requestTogglePin()">
    <mat-icon aria-hidden="true">push_pin</mat-icon>
    <span class="message-menu-copy">
      <span>{{ pinned() ? 'Bỏ ghim tin nhắn' : 'Ghim tin nhắn' }}</span>
    </span>
  </button>
  <button mat-menu-item type="button" (click)="requestCopy()">
    <mat-icon aria-hidden="true">content_copy</mat-icon>
    <span class="message-menu-copy">
      <span>Sao chép nội dung</span>
    </span>
  </button>
  <mat-divider />
  <button mat-menu-item type="button" class="message-menu-danger" (click)="requestDelete()">
    <mat-icon aria-hidden="true">{{ ownMessage() ? 'delete_forever' : 'delete_outline' }}</mat-icon>
    <span>{{ ownMessage() ? 'Thu hồi tin nhắn' : 'Xóa khỏi phía bạn' }}</span>
  </button>
</mat-menu>
