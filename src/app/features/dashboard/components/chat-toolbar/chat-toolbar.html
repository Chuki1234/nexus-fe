<mat-toolbar class="chat-toolbar !px-4">
  <span class="chat-toolbar__identity-icon mr-2 flex size-8 items-center justify-center rounded-lg">
    <mat-icon aria-hidden="true">{{ leadingIcon() }}</mat-icon>
  </span>

  <h1 class="truncate text-body-md-medium text-ink">{{ title() }}</h1>

  @if (subtitle(); as text) {
    <span aria-hidden="true" class="mx-3 h-5 w-px shrink-0 bg-hairline"></span>
    <p class="truncate text-body-sm text-steel">{{ text }}</p>
  }

  <span class="flex-1"></span>

  @if (showCallActions()) {
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control"
      disabled
      matTooltip="Gọi thoại (chưa làm)"
    >
      <mat-icon>call</mat-icon>
      <span class="sr-only">Bắt đầu cuộc gọi thoại</span>
    </button>
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control"
      disabled
      matTooltip="Gọi video (chưa làm)"
    >
      <mat-icon>videocam</mat-icon>
      <span class="sr-only">Bắt đầu cuộc gọi video</span>
    </button>
  }

  @if (showDetailsAction()) {
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control"
      [attr.aria-expanded]="detailsOpen()"
      [attr.aria-label]="(detailsOpen() ? 'Ẩn ' : 'Hiện ') + detailsLabel()"
      [matTooltip]="(detailsOpen() ? 'Ẩn ' : 'Hiện ') + detailsLabel()"
      (click)="toggleDetails.emit()"
    >
      <mat-icon>view_sidebar</mat-icon>
    </button>
  }
</mat-toolbar>
