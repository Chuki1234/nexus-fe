<mat-toolbar class="chat-toolbar pl-[68px] md:pl-8 pr-4 sm:pr-6 md:pr-8">
  @if (showAvatar()) {
    <div class="chat-toolbar__avatar hidden md:flex mr-2.5 ml-1 relative shrink-0 items-center justify-center">
      <app-avatar
        [src]="avatarSrc()"
        [name]="title()"
        [userId]="avatarUserId()"
        [presence]="avatarPresence()"
        size="md"
        ring="canvas"
      />
    </div>
  } @else {
    <span
      class="chat-toolbar__identity-icon hidden md:flex mr-2.5 ml-1 size-9 items-center justify-center rounded-xl shrink-0"
    >
      <mat-icon aria-hidden="true" class="!size-5 !text-[20px] leading-none">{{
        leadingIcon()
      }}</mat-icon>
    </span>
  }

  @if (titleClickable()) {
    <h1 class="truncate text-body-md font-bold">
      <button
        type="button"
        (click)="titleClick.emit()"
        title="Xem hồ sơ"
        class="cursor-pointer text-ink underline-offset-2 hover:underline focus-visible:underline focus-visible:outline-none"
      >{{ title() }}</button>
    </h1>
  } @else {
    <h1 class="truncate text-body-md font-bold text-ink">{{ title() }}</h1>
  }

  @if (subtitle(); as text) {
    <span aria-hidden="true" class="mx-3 h-6 w-px shrink-0 bg-hairline"></span>
    <p class="truncate text-body-sm text-steel">{{ text }}</p>
  }

  <span class="flex-1"></span>

  <div class="flex items-center gap-2 shrink-0 pr-1 mr-1">
    @if (showCallActions()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-full"
        matTooltip="Bắt đầu cuộc gọi thoại"
        (click)="startAudioCall.emit()"
      >
        <mat-icon>call</mat-icon>
        <span class="sr-only">Bắt đầu cuộc gọi thoại</span>
      </button>
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-full"
        matTooltip="Bắt đầu cuộc gọi video"
        (click)="startVideoCall.emit()"
      >
        <mat-icon>videocam</mat-icon>
        <span class="sr-only">Bắt đầu cuộc gọi video</span>
      </button>
    }

    @if (showSearch()) {
      <div class="chat-toolbar__search">
        <mat-icon class="chat-toolbar__search-icon" aria-hidden="true">search</mat-icon>
        <input
          type="text"
          class="chat-toolbar__search-input"
          placeholder="Tìm kiếm..."
          [value]="searchTerm()"
          (input)="searchTerm.set($any($event.target).value)"
          (keydown.enter)="submitSearch()"
          aria-label="Tìm kiếm tin nhắn"
        />
        @if (searchTerm()) {
          <button
            type="button"
            class="chat-toolbar__search-clear"
            (click)="clearSearch()"
            aria-label="Xóa tìm kiếm"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
    }

    @if (showPins()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-full"
        [class.nexus-icon-control--active]="pinsOpen()"
        [attr.aria-expanded]="pinsOpen()"
        [attr.aria-label]="pinsOpen() ? 'Đóng tin nhắn đã ghim' : 'Mở tin nhắn đã ghim'"
        [matTooltip]="pinsOpen() ? 'Đóng tin nhắn đã ghim' : 'Tin nhắn đã ghim'"
        (click)="openPins.emit()"
      >
        <mat-icon aria-hidden="true">push_pin</mat-icon>
      </button>
    }

    @if (showDetailsAction()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-full"
        [class.nexus-icon-control--active]="detailsOpen()"
        [attr.aria-expanded]="detailsOpen()"
        [attr.aria-label]="detailsOpen() ? 'Ẩn ' + detailsLabel() : 'Hiện ' + detailsLabel()"
        [matTooltip]="detailsOpen() ? 'Ẩn ' + detailsLabel() : 'Hiện ' + detailsLabel()"
        (click)="toggleDetails.emit()"
      >
        <mat-icon aria-hidden="true">view_sidebar</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
