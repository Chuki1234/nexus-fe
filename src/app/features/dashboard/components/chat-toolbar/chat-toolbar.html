<mat-toolbar class="chat-toolbar !px-4 sm:!px-6">
  <span class="chat-toolbar__identity-icon mr-2.5 flex size-9 items-center justify-center rounded-xl shrink-0">
    <mat-icon aria-hidden="true" class="!size-5 !text-[20px] leading-none">{{ leadingIcon() }}</mat-icon>
  </span>

  <h1 class="truncate text-body-md font-bold text-ink">{{ title() }}</h1>

  @if (subtitle(); as text) {
    <span aria-hidden="true" class="mx-3 h-6 w-px shrink-0 bg-hairline"></span>
    <p class="truncate text-body-sm text-steel">{{ text }}</p>
  }

  <span class="flex-1"></span>

  <div class="flex items-center gap-2 shrink-0 pr-1">
    @if (showCallActions()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-lg"
        matTooltip="Bắt đầu cuộc gọi thoại"
        (click)="startAudioCall.emit()"
      >
        <mat-icon>call</mat-icon>
        <span class="sr-only">Bắt đầu cuộc gọi thoại</span>
      </button>
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-lg"
        matTooltip="Bắt đầu cuộc gọi video"
        (click)="startVideoCall.emit()"
      >
        <mat-icon>videocam</mat-icon>
        <span class="sr-only">Bắt đầu cuộc gọi video</span>
      </button>
    }

    @if (showSearch()) {
      <div class="chat-toolbar__search">
        <mat-icon class="chat-toolbar__search-icon" aria-hidden="true">search</mat-icon>
        <input
          type="search"
          class="chat-toolbar__search-input"
          placeholder="Tìm trong kênh"
          aria-label="Tìm kiếm tin nhắn trong kênh"
          [value]="searchTerm()"
          (input)="searchTerm.set($any($event.target).value)"
          (keydown.enter)="submitSearch()"
        />
        @if (searchTerm().length > 0) {
          <button
            type="button"
            class="chat-toolbar__search-clear"
            matTooltip="Xoá tìm kiếm"
            aria-label="Xoá tìm kiếm"
            (click)="clearSearch()"
          >
            <mat-icon aria-hidden="true">close</mat-icon>
          </button>
        }
      </div>
    }

    @if (showPins()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-lg"
        matTooltip="Tin nhắn đã ghim"
        aria-label="Tin nhắn đã ghim"
        (click)="openPins.emit()"
      >
        <mat-icon>push_pin</mat-icon>
      </button>
    }

    @if (showDetailsAction()) {
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-9 !rounded-lg"
        [attr.aria-expanded]="detailsOpen()"
        [attr.aria-label]="(detailsOpen() ? 'Ẩn ' : 'Hiện ') + detailsLabel()"
        [matTooltip]="(detailsOpen() ? 'Ẩn ' : 'Hiện ') + detailsLabel()"
        (click)="toggleDetails.emit()"
      >
        <mat-icon>view_sidebar</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
