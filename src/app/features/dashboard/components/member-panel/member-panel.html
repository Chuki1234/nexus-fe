<div class="p-4">
  <article class="overflow-hidden rounded-md border border-hairline bg-canvas">
    <!-- Banner: chưa có ảnh nên dùng dải nền, không để khoảng trắng vô nghĩa -->
    <div aria-hidden="true" class="h-16 bg-surface"></div>

    <div class="-mt-10 px-4 pb-4">
      <app-avatar
        class="ring-4 ring-canvas rounded-full"
        [name]="name()"
        [presence]="presence()"
        size="xl"
        ring="canvas"
      />

      <h2 class="mt-3 text-heading-5 text-ink">{{ name() }}</h2>

      @if (statusMessage(); as status) {
        <p class="mt-1 text-body-sm text-slate">{{ status }}</p>
      }

      <mat-chip-set class="mt-3" aria-label="Nhãn của thành viên">
        <mat-chip>Thành viên</mat-chip>
      </mat-chip-set>

      <mat-divider class="!my-4" />

      <app-section-label text="Máy chủ chung" />
      <p class="mt-1 px-2 text-body-sm text-slate">1 máy chủ chung</p>

      <app-section-label class="mt-4 block" text="Tham gia từ" />
      <p class="mt-1 px-2 text-body-sm text-slate">19 tháng 3, 2020</p>

      <button mat-flat-button class="!mt-5 !w-full" type="button" disabled>Xem hồ sơ đầy đủ</button>
    </div>
  </article>
</div>
