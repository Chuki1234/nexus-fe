@if (context(); as activeContext) {
  <section
    class="composer-context"
    [attr.data-context-kind]="activeContext.kind"
    aria-live="polite"
  >
    <span class="composer-context__icon" aria-hidden="true">
      <mat-icon>{{ activeContext.icon }}</mat-icon>
    </span>
    <span class="composer-context__copy">
      <strong>{{ activeContext.label }}</strong>
      <span>{{ activeContext.description }}</span>
    </span>
    <button
      mat-icon-button
      type="button"
      class="composer-context__close nexus-icon-control"
      aria-label="Đóng thao tác tin nhắn"
      matTooltip="Đóng"
      (click)="contextClosed.emit()"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </section>
}

<div
  class="composer-shell relative rounded-xl bg-surface-soft p-1 shadow-card"
  data-composer-state="preview"
>
  <span class="composer-thread" aria-hidden="true"></span>
  <div class="composer-core flex items-center gap-2 rounded-lg bg-canvas px-2 py-1">
    <button
      mat-icon-button
      type="button"
      disabled
      class="composer-action"
      matTooltip="Đính kèm (chưa làm)"
    >
      <mat-icon>add_circle</mat-icon>
      <span class="sr-only">Đính kèm tệp</span>
    </button>

    <input
      type="text"
      disabled
      [attr.aria-label]="'Nhắn ' + target()"
      [placeholder]="'Nhắn ' + target()"
      class="min-w-0 flex-1 bg-transparent py-2 text-body-sm text-ink placeholder:text-steel focus:outline-none disabled:cursor-not-allowed"
    />

    <button
      mat-icon-button
      type="button"
      disabled
      class="composer-action"
      matTooltip="Sticker (chưa làm)"
    >
      <mat-icon>emoji_emotions</mat-icon>
      <span class="sr-only">Chọn sticker</span>
    </button>

    <button
      mat-icon-button
      type="button"
      disabled
      class="composer-send"
      matTooltip="Gửi tin nhắn (chưa kết nối backend)"
    >
      <mat-icon>arrow_upward</mat-icon>
      <span class="sr-only">Gửi tin nhắn</span>
    </button>
  </div>
</div>

<p class="composer-hint mt-1.5 px-2 text-micro text-stone">
  Chế độ xem trước · Kết nối backend để gửi tin nhắn
</p>
