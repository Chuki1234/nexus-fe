<section class="theme-studio p-4" aria-labelledby="theme-studio-intro-title">
  <div class="theme-studio__intro flex gap-3 rounded-xl p-3">
    <span
      class="theme-studio__intro-icon flex size-10 shrink-0 items-center justify-center rounded-xl"
      aria-hidden="true"
    >
      <mat-icon>view_quilt</mat-icon>
    </span>
    <span class="min-w-0">
      <h3 id="theme-studio-intro-title" class="text-body-sm-medium text-ink">
        Màu đi theo cấu trúc
      </h3>
      <p class="mt-0.5 text-caption text-slate">
        Mỗi bộ phối riêng rail, sidebar, nội dung và panel — xanh Nexus vẫn dành cho hành động.
      </p>
    </span>
  </div>

  <div class="mt-4 grid gap-2" role="radiogroup" aria-label="Chọn không khí màu cho Dashboard">
    @for (option of options; track option.id) {
      <button
        matRipple
        type="button"
        role="radio"
        class="theme-studio__option"
        [class.theme-studio__option--selected]="selected() === option.id"
        [attr.aria-checked]="selected() === option.id"
        [attr.data-atmosphere-option]="option.id"
        (click)="select(option.id)"
      >
        <span
          class="theme-atmosphere-preview"
          [attr.data-atmosphere-preview]="option.id"
          aria-hidden="true"
        >
          <span class="theme-atmosphere-preview__rail"></span>
          <span class="theme-atmosphere-preview__sidebar"></span>
          <span class="theme-atmosphere-preview__workspace">
            <span class="theme-atmosphere-preview__panel"></span>
          </span>
        </span>

        <span class="min-w-0">
          <span class="block truncate text-body-sm-medium text-ink">{{ option.name }}</span>
          <span class="mt-0.5 block truncate text-caption text-steel">
            {{ option.description }}
          </span>
        </span>

        <span class="theme-studio__selection flex size-7 items-center justify-center rounded-full">
          @if (selected() === option.id) {
            <mat-icon aria-hidden="true" class="!size-4 !text-base">check</mat-icon>
          }
        </span>
      </button>
    }
  </div>

  <p class="theme-studio__footnote mt-4 flex items-start gap-2 text-caption text-steel">
    <mat-icon aria-hidden="true" class="mt-0.5 !size-4 !text-base">devices</mat-icon>
    <span>Bộ màu này chỉ áp dụng cho Dashboard và được giữ lại sau khi tải lại trang.</span>
  </p>
</section>
