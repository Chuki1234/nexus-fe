<app-search-field placeholder="Tìm người trên Nexus…" [(value)]="query" />

@if (results().length) {
  <!-- Dropdown đè lên nội dung phía dưới: đẩy nội dung xuống thì cả trang nhảy
       theo mỗi nhịp gõ. -->
  <ul
    class="absolute inset-x-0 top-full z-20 mt-1 max-h-80 overflow-y-auto rounded-lg border border-hairline bg-surface py-1 shadow-modal"
  >
    @for (person of results(); track person.id) {
      <li>
        <button
          type="button"
          (click)="open(person.username)"
          class="flex w-full items-center gap-3 px-3 py-2 text-left transition-colors hover:bg-surface-feature"
        >
          <app-avatar [name]="nameOf(person)" [src]="person.avatarUrl" size="sm" ring="surface" />
          <span class="min-w-0 flex-1">
            <span class="block truncate text-body-sm-medium text-ink">{{ nameOf(person) }}</span>
            <span class="block truncate text-caption text-steel">&commat;{{ person.username }}</span>
          </span>
        </button>
      </li>
    }
  </ul>
} @else if (searched() && !searching()) {
  <p
    class="absolute inset-x-0 top-full z-20 mt-1 rounded-lg border border-hairline bg-surface px-3 py-2.5 text-caption text-steel shadow-modal"
  >
    Không tìm thấy ai khớp.
  </p>
}
