@if (interactive()) {
  <app-avatar
    [appProfileTrigger]="username() ?? ''"
    [attr.aria-label]="'Xem hồ sơ của ' + name()"
    [name]="name()"
    [src]="avatarUrl()"
    [size]="size()"
    [presence]="presence()"
    [ring]="ring()"
  />
} @else {
  <app-avatar
    [name]="name()"
    [src]="avatarUrl()"
    [size]="size()"
    [presence]="presence()"
    [ring]="ring()"
  />
}
