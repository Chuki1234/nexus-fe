<div
  class="voice-controls-bar flex items-center gap-2 rounded-full border border-hairline/80 bg-surface/90 p-2 backdrop-blur-md shadow-modal"
  role="toolbar"
  aria-label="Thanh điều khiển phòng thoại"
>
  <!-- 1. Microphone Control Group -->
  <div class="flex items-center rounded-full bg-surface-feature/70 p-0.5">
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-11"
      [class.!text-danger]="isMicMuted()"
      [class.!bg-danger/20]="isMicMuted()"
      [matTooltip]="isDeafened() ? 'Bật Micro và Tai nghe' : (isMicMuted() ? 'Bật Micro' : 'Tắt Micro')"
      (click)="toggleMic()"
      [attr.aria-pressed]="!isMicMuted()"
    >
      <mat-icon>{{ isMicMuted() ? 'mic_off' : 'mic' }}</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      #audioTrigger="matMenuTrigger"
      [matMenuTriggerFor]="audioMenuRef.menu()"
      class="nexus-icon-control !size-7 !min-w-0"
      matTooltip="Cài đặt Micro"
      aria-label="Chọn thiết bị micro"
    >
      <mat-icon
        class="!size-4 !text-base transition-transform duration-200"
        [class.rotate-180]="audioTrigger.menuOpen"
      >expand_more</mat-icon>
    </button>
    <app-device-menu #audioMenuRef kind="audio" />
  </div>

  <!-- 2. Headphone / Deafen Control Group -->
  <div class="flex items-center rounded-full bg-surface-feature/70 p-0.5">
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-11"
      [class.!text-danger]="isDeafened()"
      [class.!bg-danger/20]="isDeafened()"
      [matTooltip]="isDeafened() ? 'Bật âm thanh' : 'Tắt âm thanh'"
      (click)="toggleDeafen()"
      [attr.aria-pressed]="!isDeafened()"
    >
      <mat-icon>{{ isDeafened() ? 'headset_off' : 'headset' }}</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      #outputTrigger="matMenuTrigger"
      [matMenuTriggerFor]="outputMenuRef.menu()"
      class="nexus-icon-control !size-7 !min-w-0"
      matTooltip="Cài đặt Loa / Tai nghe"
      aria-label="Chọn thiết bị âm thanh đầu ra"
    >
      <mat-icon
        class="!size-4 !text-base transition-transform duration-200"
        [class.rotate-180]="outputTrigger.menuOpen"
      >expand_more</mat-icon>
    </button>
    <app-device-menu #outputMenuRef kind="output" />
  </div>

  <!-- 2. Camera Control Group -->
  <div class="flex items-center rounded-full bg-surface-feature/70 p-0.5">
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-11"
      [class.!text-primary]="isCameraOn()"
      [class.!bg-primary/20]="isCameraOn()"
      [matTooltip]="isCameraOn() ? 'Tắt Camera' : 'Bật Camera'"
      (click)="toggleCamera()"
      [attr.aria-pressed]="isCameraOn()"
    >
      <mat-icon>{{ isCameraOn() ? 'videocam' : 'videocam_off' }}</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      #videoTrigger="matMenuTrigger"
      [matMenuTriggerFor]="videoMenuRef.menu()"
      class="nexus-icon-control !size-7 !min-w-0"
      matTooltip="Cài đặt Camera"
      aria-label="Chọn thiết bị camera"
    >
      <mat-icon
        class="!size-4 !text-base transition-transform duration-200"
        [class.rotate-180]="videoTrigger.menuOpen"
      >expand_more</mat-icon>
    </button>
    <app-device-menu #videoMenuRef kind="video" />
  </div>

  <!-- 3. Screen Share Control Group -->
  @if (isScreenSharing()) {
    <div class="flex items-center rounded-full bg-primary/20 border border-primary/40 p-0.5 shadow-sm">
      <button
        mat-icon-button
        type="button"
        class="nexus-icon-control !size-11 !bg-primary !text-on-primary"
        matTooltip="Dừng chia sẻ màn hình"
        (click)="toggleScreenShare()"
        aria-pressed="true"
      >
        <mat-icon>stop_screen_share</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        #screenShareTrigger="matMenuTrigger"
        [matMenuTriggerFor]="screenShareMenu"
        class="nexus-icon-control !size-7 !min-w-0 !text-primary hover:!bg-primary/20"
        matTooltip="Tùy chọn chia sẻ màn hình"
        aria-label="Tùy chọn chia sẻ màn hình"
      >
        <mat-icon
          class="!size-4 !text-base transition-transform duration-200"
          [class.rotate-180]="screenShareTrigger.menuOpen"
        >expand_more</mat-icon>
      </button>

      <mat-menu #screenShareMenu="matMenu" yPosition="above" [overlapTrigger]="false" class="nexus-device-menu !rounded-2xl !bg-surface !p-1.5 !border !border-hairline/80 shadow-modal">
        <button
          mat-menu-item
          type="button"
          (click)="switchScreenShare()"
          class="!flex !items-center !gap-2.5 !rounded-xl !px-3 !py-2 hover:!bg-surface-feature !text-ink cursor-pointer"
        >
          <mat-icon class="!size-4 !text-base text-primary">screen_share</mat-icon>
          <span class="text-body-sm font-semibold">Đổi màn hình chia sẻ</span>
        </button>
        <button
          mat-menu-item
          type="button"
          (click)="toggleScreenShare()"
          class="!flex !items-center !gap-2.5 !rounded-xl !px-3 !py-2 hover:!bg-danger/15 !text-danger cursor-pointer"
        >
          <mat-icon class="!size-4 !text-base text-danger">stop_screen_share</mat-icon>
          <span class="text-body-sm font-semibold">Dừng chia sẻ màn hình</span>
        </button>
      </mat-menu>
    </div>
  } @else {
    <button
      mat-icon-button
      type="button"
      class="nexus-icon-control !size-11 !rounded-full"
      matTooltip="Chia sẻ màn hình"
      (click)="toggleScreenShare()"
      aria-pressed="false"
    >
      <mat-icon>screen_share</mat-icon>
    </button>
  }

  <!-- 4. Fullscreen Button -->
  <button
    mat-icon-button
    type="button"
    class="nexus-icon-control !size-11 !rounded-full"
    [matTooltip]="isFullscreen() ? 'Thoát toàn màn hình' : 'Toàn màn hình'"
    (click)="toggleFullscreen()"
  >
    <mat-icon>{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
  </button>

  <!-- 5. Disconnect / Leave Room Button -->
  <button
    mat-flat-button
    type="button"
    class="!h-11 !rounded-full !bg-danger !px-5 !text-white hover:!bg-danger/80 transition-all font-semibold"
    matTooltip="Ngắt kết nối"
    (click)="leaveRoom()"
  >
    <mat-icon class="!mr-1">call_end</mat-icon>
    <span>Rời phòng</span>
  </button>
</div>
