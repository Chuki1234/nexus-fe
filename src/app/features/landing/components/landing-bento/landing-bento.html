<section class="bento" id="chi-tiet">
  <div class="bento__head" appReveal [revealY]="26">
    <p class="eyebrow">Và nhiều hơn thế nữa</p>
    <h2 class="bento__title">Đầy đủ mọi thứ bạn cần, trong một ứng dụng.</h2>
  </div>

  <ul class="bento__grid" appReveal [revealStagger]="0.08" [revealY]="34">
    @for (card of cards; track card.title) {
      <li class="card">
        <span class="card__icon material-icons" aria-hidden="true">{{ card.icon }}</span>
        <h3 class="card__title">{{ card.title }}</h3>
        <p class="card__body">{{ card.body }}</p>
      </li>
    }
  </ul>
</section>
