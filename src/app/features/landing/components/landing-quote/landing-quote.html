<section class="quote" id="community">
  <div class="tst__head" appReveal [revealY]="26">
    <p class="eyebrow">Cảm nhận từ người dùng</p>
    <h2 class="tst__title">Được các cộng đồng tin dùng.</h2>
  </div>

  <ul class="tst__grid" appReveal [revealStagger]="0.08" [revealY]="34">
    @for (t of testimonials; track t.name) {
      <li class="tst">
        <blockquote class="tst__text">{{ t.text }}</blockquote>
        <div class="tst__by">
          <span class="tst__avatar" [style.background]="t.hue" aria-hidden="true">{{ t.initials }}</span>
          <span class="tst__id">
            <b class="tst__name">{{ t.name }}</b>
            <span class="tst__role">{{ t.role }}</span>
          </span>
        </div>
      </li>
    }
  </ul>
</section>
