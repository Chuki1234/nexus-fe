<section class="cta-wrap">
  <div class="cta">
    <!-- Bộ ba tắc kè nối mạng: cá thể khác màu, cùng một mạng lưới (Nexus) -->
    <div class="cta__crew" aria-hidden="true">
      <app-landing-mascot class="cta__mascot" variant="purple" />
      <app-landing-mascot class="cta__mascot cta__mascot--lead" variant="green" [waving]="true" />
      <app-landing-mascot class="cta__mascot" variant="orange" />
    </div>

    <h2 class="cta__title">Sẵn sàng xây dựng cộng đồng của bạn?</h2>
    <p class="cta__body">
      Tạo cộng đồng đầu tiên chỉ trong vài giây. Mời bạn bè, tạo kênh và bắt đầu
      kết nối — hoàn toàn miễn phí.
    </p>
    <div class="cta__actions">
      <a class="btn-pill" routerLink="/register">Tạo cộng đồng miễn phí</a>
      <a class="btn-outline" routerLink="/login">Đã có tài khoản? Đăng nhập</a>
    </div>
  </div>
</section>
