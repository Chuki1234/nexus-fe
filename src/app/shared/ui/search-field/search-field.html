<div
  class="flex h-9 items-center gap-2 rounded-lg border border-hairline bg-surface px-3 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all shadow-2xs"
>
  <mat-icon aria-hidden="true" class="!w-4 !h-4 !text-[16px] text-steel shrink-0 leading-none">search</mat-icon>
  <input
    [id]="inputId"
    type="search"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="placeholder()"
    (input)="onInput($event)"
    class="min-w-0 flex-1 bg-transparent text-body-sm text-ink placeholder:text-steel focus:outline-none disabled:cursor-not-allowed"
  />
  @if (value() && !disabled()) {
    <button
      type="button"
      (click)="value.set('')"
      class="w-5 h-5 rounded-xs text-steel hover:text-ink hover:bg-surface-feature flex items-center justify-center transition-colors cursor-pointer"
      aria-label="Xoá nội dung tìm kiếm"
    >
      <mat-icon aria-hidden="true" class="!w-3.5 !h-3.5 !text-[14px] leading-none">close</mat-icon>
    </button>
  }
</div>
