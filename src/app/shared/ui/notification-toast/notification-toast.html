<div
  class="fixed bottom-6 right-6 z-[99999] flex flex-col-reverse gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"
  aria-live="polite"
  aria-atomic="true"
>
  @for (notif of notificationService.notifications(); track notif.id) {
    <div
      class="pointer-events-auto w-full rounded-2xl bg-[#111214]/95 border border-[#2b2d31] shadow-2xl p-3.5 flex items-start gap-3.5 animate-slide-up hover:bg-[#1e1f22] hover:border-primary/50 transition-all cursor-pointer ring-1 ring-white/10 group backdrop-blur-md"
      (click)="onClickNotification(notif)"
      role="alert"
    >
      <!-- Avatar -->
      <div class="relative w-10 h-10 rounded-full overflow-hidden shrink-0 bg-[#2b2d31] border border-white/10 shadow-xs flex items-center justify-center">
        @if (notif.senderAvatarUrl) {
          <img [src]="notif.senderAvatarUrl" [alt]="notif.senderName" class="w-full h-full object-cover" />
        } @else {
          <span class="text-primary font-bold text-base">{{ notif.senderName.charAt(0).toUpperCase() }}</span>
        }
      </div>

      <!-- Info & Content -->
      <div class="flex-1 min-w-0 space-y-1">
        <div class="flex items-center justify-between gap-2">
          <span class="text-body-sm font-extrabold text-white truncate leading-tight group-hover:text-primary transition-colors">
            {{ notif.senderName }}
          </span>

          <button
            type="button"
            (click)="dismiss($event, notif.id)"
            class="text-[#949ba4] hover:text-white p-1 rounded-md hover:bg-white/10 transition-colors cursor-pointer shrink-0 opacity-60 group-hover:opacity-100"
            title="Đóng thông báo"
          >
            <mat-icon class="!w-3.5 !h-3.5 !text-[14px]">close</mat-icon>
          </button>
        </div>

        <div class="flex items-center gap-1.5 text-[11px] text-primary font-semibold truncate">
          @if (notif.type === 'mention') {
            <span class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold">@mention</span>
          }
          <span>{{ notif.contextTag }}</span>
        </div>

        <p class="text-[13px] text-[#dbdee1] leading-snug line-clamp-2 break-words font-normal">
          {{ notif.content }}
        </p>
      </div>
    </div>
  }
</div>
