<div
  class="in-app-toast-container fixed bottom-6 right-6 z-[99999] flex flex-col-reverse gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"
  aria-live="polite"
  aria-atomic="true"
>
  @for (notif of notificationService.notifications(); track notif.id) {
    <div
      class="in-app-toast-card pointer-events-auto"
      (click)="onClickNotification(notif)"
      role="alert"
    >
      <!-- Avatar with presence / indicator ring -->
      <div class="in-app-toast-avatar-wrapper shrink-0">
        <app-avatar
          [name]="notif.senderName"
          [src]="notif.senderAvatarUrl ?? null"
          size="md"
          ring="surface"
        />
      </div>

      <!-- Info & Content -->
      <div class="in-app-toast-body flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <span class="in-app-toast-sender truncate">
            {{ notif.senderName }}
          </span>

          <button
            type="button"
            (click)="dismiss($event, notif.id)"
            class="in-app-toast-close-btn"
            title="Đóng thông báo"
            aria-label="Đóng thông báo"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <div class="flex items-center gap-1.5 mt-0.5 mb-1 text-[11px] truncate">
          @if (notif.type === 'mention') {
            <span class="in-app-toast-mention-badge">@mention</span>
          }
          <span class="in-app-toast-context">{{ notif.contextTag }}</span>
        </div>

        <p class="in-app-toast-content line-clamp-2">
          {{ notif.content }}
        </p>
      </div>
    </div>
  }
</div>
