@if (src() && !imageFailed()) {
  <img
    [src]="src()"
    [alt]="name()"
    (error)="imageFailed.set(true)"
    [class]="'rounded-full object-cover ' + box()"
  />
} @else {
  <span
    aria-hidden="true"
    [class]="
      'flex items-center justify-center rounded-full bg-surface text-ink ' + box() + ' ' + text()
    "
  >
    {{ initials() }}
  </span>
  <span class="sr-only">{{ name() }}</span>
}

@if (presence(); as status) {
  <app-status-dot
    class="absolute right-0 bottom-0"
    [presence]="status"
    [size]="dotSize()"
    [ring]="ring()"
  />
}
