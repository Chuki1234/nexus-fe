@if (src() && !imageFailed()) {
  <img
    [src]="src()"
    [alt]="name()"
    (error)="imageFailed.set(true)"
    [class]="'rounded-full object-cover ' + box()"
  />
} @else {
  <span
    aria-hidden="true"
    [attr.data-avatar-tone]="tone()"
    [class]="
      'avatar-fallback flex items-center justify-center rounded-full bg-surface text-ink font-semibold ' +
      box() +
      ' ' +
      text()
    "
  >
    {{ initials() }}
  </span>
  <span class="sr-only">{{ name() }}</span>
}

@if (effectivePresence(); as status) {
  <app-status-dot
    class="absolute right-0 bottom-0 z-10"
    [presence]="status"
    [size]="dotSize()"
    [ring]="ring()"
  />
}
