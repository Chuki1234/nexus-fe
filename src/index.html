<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>NexusCord</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content Security Policy (CSP) - Development Policy:
      - Origins phát triển cục bộ: Backend API & Socket (localhost:3000, localhost:8000, 127.0.0.1:3000, 127.0.0.1:8000).
      - Supabase Auth/REST/Storage và Realtime WSS được enumerate tường minh.
      - GIPHY Search API & CDN allowlist được enumerate tường minh.
      - wss: được giữ để hỗ trợ kết nối LiveKit WebRTC Cloud/Server khi URL máy chủ phòng thoại cấu hình động qua LIVEKIT_URL.
      - CSP production hardening deferred: Trong môi trường Production, chính sách CSP phải được tạo động và inject qua HTTP Response Header của Reverse Proxy/Nginx/CDN từ biến môi trường (SUPABASE_URL, LIVEKIT_URL, API_URL) nhằm khóa chặt origin LiveKit cụ thể và loại bỏ scheme wildcard wss:.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ubdgjtjxcytwctsbtpjy.supabase.co https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://i.giphy.com https://giphy.com https://www.giphy.com https://img.stipop.io https://api.dicebear.com https://lh3.googleusercontent.com https://images.igdb.com https://shared.fastly.steamstatic.com https://placehold.co; media-src 'self' blob: https://ubdgjtjxcytwctsbtpjy.supabase.co https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://i.giphy.com; connect-src 'self' http://localhost:3000 ws://localhost:3000 http://localhost:8000 ws://localhost:8000 http://127.0.0.1:3000 ws://127.0.0.1:3000 http://127.0.0.1:8000 ws://127.0.0.1:8000 https://ubdgjtjxcytwctsbtpjy.supabase.co wss://ubdgjtjxcytwctsbtpjy.supabase.co https://api.giphy.com https://*.livekit.cloud https://tuitentai-yx03qucb.livekit.cloud wss:; font-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <link rel="icon" type="image/png" href="/assets/nexus-mascot.png" />
    <script>
      try {
        const nexusTheme = localStorage.getItem('nexuscord-theme');
        if (nexusTheme === 'light' || nexusTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', nexusTheme);
        }
      } catch {
        // Storage có thể bị chặn; CSS mặc định dark vẫn là fallback hợp lệ.
      }
    </script>
    <!-- Font nạp qua styles.css từ @fontsource/inter và material-icons (tự host).
         `ng add @angular/material` mặc định chèn link CDN Google Fonts vào đây;
         đã gỡ theo ghi chú trong styles.css — CDN làm chậm first paint và lộ IP
         người dùng sang máy chủ của Google. -->
  </head>
  <body>
    <app-root>
      <section
        class="nexus-boot nexus-boot--static"
        data-nexus-boot="static"
        role="status"
        aria-live="polite"
        aria-label="Nexus đang tải"
      >
        <div class="nexus-boot__content">
          <div class="nexus-boot__brand-stage" aria-hidden="true">
            <span class="nexus-boot__beam nexus-boot__beam--wide"></span>
            <span class="nexus-boot__beam nexus-boot__beam--tight"></span>
            <span class="nexus-boot__halo"></span>
            <img
              class="nexus-boot__brand-logo"
              src="/assets/nexus-brand-transparent.png"
              width="1983"
              height="532"
              alt=""
            />
          </div>

          <div class="nexus-boot__copy">
            <span>Đang mở không gian trò chuyện</span>
          </div>

          <span class="nexus-boot__progress" aria-hidden="true"><span></span></span>
        </div>
      </section>
    </app-root>
  </body>
</html>
